<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0f0c20"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="url(#heartGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Ambient background glow behind hearts -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>

  <!-- Interlocking Couple Hearts -->
  <g filter="url(#glow)">
    <!-- Primary Big Heart -->
    <path d="M256 410 C256 410 110 300 110 200 C110 135 160 100 215 100 C242 100 256 120 256 120 C256 120 270 100 297 100 C352 100 402 135 402 200 C402 300 256 410 256 410 Z" 
          fill="url(#heartGrad)"/>

    <!-- Inner Golden Sparkle Core -->
    <path d="M256 185 L263 205 L283 212 L263 219 L256 239 L249 219 L229 212 L249 205 Z" 
          fill="#fef08a" opacity="0.9"/>
    <circle cx="210" cy="180" r="6" fill="#fff" opacity="0.8"/>
    <circle cx="302" cy="180" r="6" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Subtle 'DUO' bottom badge lettering -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="8" text-anchor="middle" opacity="0.95">DUO</text>
</svg>
